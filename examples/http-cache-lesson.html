* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); }
.wrap { max-width: 680px; margin: 0 auto; padding: 48px 20px 72px; }

#intro { margin: 0; color: var(--muted); font-size: .94rem; }
#intro:empty { display: none; }
.progress { display: flex; align-items: center; gap: 12px; margin: 20px 0 0; }
.bar { flex: 1; height: 4px; background: var(--rule); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--ink); width: 0; transition: width .3s ease-out; }
#progress p { margin: 0; font-size: .82rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .bar > span { transition: none; } }

/* tabs */
[role="tablist"] { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--rule); margin: 24px 0 32px; }
[role="tablist"]::-webkit-scrollbar { display: none; }

[role="tab"][aria-selected="true"] { color: var(--text); border-bottom-color: var(--ink); font-weight: 600; }

/* knowledge-point stepper: one numbered dot per point */
.stepper { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 24px; padding: 0; list-style: none; }
.stepper button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--rule-strong); background: transparent; color: var(--muted); font: inherit; font-size: .85rem; font-variant-numeric: tabular-nums; cursor: pointer; transition: background-color .12s ease, border-color .12s ease; }
.stepper button[data-status="inprog"] { border-style: dashed; border-color: var(--text); color: var(--text); }
.stepper button[data-status="done"] { background: var(--ink); border-color: var(--ink); color: var(--ink-text); }
.stepper button[data-status="mixed"] { background: var(--mid-bg); border-color: var(--mid); color: var(--mid); }
.stepper button[aria-current="step"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--mark-ring); color: var(--text); border-color: var(--text); }
.stepper button[aria-current="step"][data-status="done"] { color: var(--ink-text); }

/* typography */
h2 { font-size: 1.3rem; font-weight: 650; line-height: 1.4; margin: 0 0 8px; }
h3 { font-size: 1rem; font-weight: 600; margin: 0 0 6px; }
p { margin: 8px 0; }
.muted { color: var(--muted); }
.small { font-size: .9rem; }
strong { font-weight: 600; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88em; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
pre { background: var(--surface-2); padding: 12px 14px; border-radius: 10px; overflow-x: auto; margin: 12px 0; line-height: 1.55; }
pre code { background: none; padding: 0; }

/* the point heading sits on the page, not in a box */
.card.kp-head { background: none; border: 0; padding: 0; margin: 0 0 20px; }
.kp-meta { margin: 0 0 4px; font-size: .82rem; color: var(--muted); letter-spacing: .02em; }
details.why { margin: 4px 0 0; font-size: .88rem; color: var(--muted); }
details.why summary { cursor: pointer; width: fit-content; }
details.why p { margin: 4px 0 0; }

/* question cards */
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 24px; margin: 0 0 16px; }
.card:not(.open):not(.kp-head):not(.group) { background: transparent; }
.card.open { border-color: var(--rule-strong); }
.card.read { background: none; border: 0; border-top: 1px solid var(--rule); border-radius: 0; padding: 24px 0 8px; margin: 0; }
.card.read:last-of-type { margin-bottom: 24px; }
.card.read h2 { font-size: 1.15rem; }
.card legend, .card > p:first-child > strong, .card > h2 { font-size: 1.1rem; font-weight: 600; line-height: 1.6; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { padding: 0; margin-bottom: 12px; }
fieldset.conf { margin-top: 20px; }
fieldset.conf legend { font-size: .9rem; font-weight: 500; color: var(--muted); margin-bottom: 8px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 20px; }

button.btn, a.btn, label.btn { font: inherit; font-size: .95rem; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 20px; border-radius: 10px; border: 1px solid var(--ink); background: var(--ink); color: var(--ink-text); cursor: pointer; text-decoration: none; transition: transform .12s ease-out, opacity .12s ease; }
button.btn:active:not(:disabled), label.btn:active { transform: scale(.98); }

button.btn:disabled { background: var(--rule); border-color: var(--rule); color: var(--muted); cursor: not-allowed; }

/* answer options */
.option { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; margin: 8px 0; cursor: pointer; background: var(--surface); transition: border-color .12s ease, background-color .12s ease; }
.option input { margin: 5px 0 0; accent-color: var(--ink); flex: none; }
.option:has(input:checked) { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }

.flow { position: relative; margin: 16px 0; }

.node { position: relative; padding: 4px 0 4px 44px; min-height: 36px; }

.node.cell-bad .num { background: var(--bad-bg); border: 1px solid var(--bad); color: var(--bad); }
.arrow { padding: 0 0 0 44px; min-height: 12px; font-size: .8rem; color: var(--muted); }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
select { font: inherit; font-size: .85rem; padding: 3px 8px; border-radius: 8px; border: 1px solid var(--rule-strong); background: var(--surface); color: var(--text); }
footer { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--rule); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; font-size: .82rem; color: var(--muted); }

  .wrap { padding: 28px 16px 48px; }
  header.top h1 { font-size: 1.4rem; }
  .card { padding: 18px 16px; }
  [role="tab"] { padding: 10px 9px; }
}
</style>

      a.result = g.result; a.coach_graded = true;
      delete a.self_assessed;
      if (note) a.note = note; else delete a.note;
      if (errorType) a.error_type = errorType; else delete a.error_type;
      Object.keys(state.ui).forEach(function (k) { if (state.ui[k].attemptId === a.id) state.ui[k].result = a.result; });
      if (String(a.id).split('~')[2] === 'plain-talk') state.pt.result = a.result;
      applied += 1;
    });
    save();
    var msg = applied ? fmt(T.gradingOk, { n: applied }) : (missing ? '' : T.gradingNone);
    if (missing) msg += (msg ? ' ' : '') + fmt(T.gradingMissing, { n: missing });
    return msg;
  }

  function renderData(panel) {
    panel.appendChild(exportBox(T.exportTitle, T.exportHelp, buildExport, data.lesson_id + '.closebook.json', 'application/json'));
    panel.appendChild(exportBox(T.exportAnswers, T.exportAnswersHelp, buildAnswers, data.lesson_id + '.answers.md', 'text/markdown'));
    var area = h('textarea', { rows: 6, 'aria-label': T.importTitle, class: 'import-area' });
    var status = h('p', { class: 'small', 'aria-live': 'polite' });
    var file = h('input', { type: 'file', accept: '.json,application/json', class: 'sr-only', id: 'import-file', onchange: function () {
      var f = this.files && this.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () { area.value = String(reader.result || ''); };
      reader.readAsText(f);
    } });
    panel.appendChild(h('section', { class: 'card' }, h('h2', null, T.importTitle), h('p', { class: 'small muted' }, T.importHelp),
      h('label', null, h('span', { class: 'sr-only' }, T.importTitle), area),
      h('div', { class: 'row' },
        h('button', { type: 'button', class: 'btn', onclick: function () { var msg = importJson(area.value); status.textContent = msg; announce(msg); renderProgress(); } }, T.importBtn),
        file, h('label', { for: 'import-file', class: 'btn secondary', role: 'button', tabindex: '0',
          onkeydown: function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); } } }, T.importFile)),
      status));
    panel.appendChild(h('section', { class: 'card' }, h('p', { class: 'small muted' }, state.storage ? T.storageOn : T.storageOff),
      h('button', { type: 'button', class: 'btn quiet', onclick: function () {
        if (!window.confirm(T.resetConfirm)) return;
        state.attempts = []; state.seq = 0; state.ui = {}; state.teach = {}; state.recall = {}; state.pt = {}; state.ptViewed = {};
        save(); render();
      } }, T.reset)));
  }

  // ---------- frame ----------
  function tabs() {
    var list = [['learn', T.tabLearn]];
    if (data.free_recall) list.push(['recall', T.tabRecall]);
    if (data.plain_talk) list.push(['plain', T.tabPlain]);
    list.push(['mistakes', T.tabMistakes], ['data', T.tabData]);
    return list;
  }
  function renderTabs() {
    var nav = document.getElementById('tabs');
    nav.textContent = '';
    nav.setAttribute('aria-label', 'closebook');
    var list = tabs();
    list.forEach(function (t, i) {
      nav.appendChild(h('button', { type: 'button', role: 'tab', id: 'tab-' + t[0], 'aria-selected': state.tab === t[0] ? 'true' : 'false',
        'aria-controls': 'panel', tabindex: state.tab === t[0] ? '0' : '-1',
        onclick: function () { state.tab = t[0]; render(); },
        onkeydown: function (e) {
          var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
          if (!d) return;
          e.preventDefault();
          var nt = list[(i + d + list.length) % list.length][0];
          state.tab = nt; render(); document.getElementById('tab-' + nt).focus();
        } }, t[1]));
    });
  }
  function renderProgress() {
    var total = 0, done = 0;
    data.knowledge_points.forEach(function (kp) { kp.items.forEach(function (it) { total++; var u = state.ui[keyOf(kp, it)]; if (u && u.done) done++; }); });
    var pct = total ? Math.round(done * 100 / total) : 0;
    var el = document.getElementById('progress');
    el.textContent = '';
    el.appendChild(h('div', { class: 'bar', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(total), 'aria-valuenow': String(done),
      'aria-label': fmt(T.progress, { done: done, total: total }) }, h('span', { style: 'width:' + pct + '%' })));
    el.appendChild(h('p', { class: 'small muted' }, fmt(T.progress, { done: done, total: total })));
  }
  function render(moveFocus) {
    renderTabs();
    renderProgress();
    var panel = document.getElementById('panel');
    panel.textContent = '';
    panel.setAttribute('aria-labelledby', 'tab-' + state.tab);
    if (state.tab === 'learn') renderLearn(panel);
    else if (state.tab === 'recall') renderRecall(panel);
    else if (state.tab === 'plain') renderPlain(panel);
    else if (state.tab === 'mistakes') renderMistakes(panel);
    else renderData(panel);
    save();
    if (moveFocus !== false) {
      var target = panel.querySelector('[data-focus="1"]') || panel.querySelector('.card.open textarea, .card.open input, .card.open button');
      if (target && moveFocus) target.focus({ preventScroll: false });
      else if (target && document.activeElement === document.body) target.focus({ preventScroll: true });
    }
  }

  function fail(message) {
    document.getElementById('panel').appendChild(h('p', { class: 'notice' }, message));
  }

  function init() {
    T = STRINGS.en;
    try {
      data = JSON.parse(document.getElementById('lesson-data').textContent);
      if (!data || !Array.isArray(data.knowledge_points) || !data.knowledge_points.length || !data.lesson_id) throw new Error('missing lesson_id or knowledge_points');
      data.knowledge_points.forEach(function (kp) { if (!Array.isArray(kp.items) || !kp.items.length) throw new Error('point ' + kp.id + ' has no items'); });
    } catch (e) {
      fail(T.dataError + e.message);
      return;
    }
    if (/^zh/i.test(data.language || '')) { T = STRINGS.zh; }
    document.documentElement.lang = data.language || 'en';
    document.title = data.topic + ' · closebook';
    document.getElementById('title').textContent = data.topic;
    document.getElementById('intro').textContent = data.intro || '';
    document.getElementById('footer').textContent = T.footer;
    storeKey = 'closebook:' + data.lesson_id;
    restore();
    rebuildFromAttempts();

    var theme = document.getElementById('theme');
    document.getElementById('theme-label').textContent = T.theme + ' ';
    [['auto', T.themeAuto], ['light', T.themeLight], ['dark', T.themeDark]].forEach(function (o) {
      var opt = h('option', { value: o[0] }, o[1]);
      theme.appendChild(opt);
    });
    theme.value = themePref();
    applyTheme(theme.value);
    theme.addEventListener('change', function () { applyTheme(themePref(theme.value)); });
    render(false);
  }

  init();
})();
</script>
</body>
</html>
