<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>closebook</title>
<!--
  closebook lesson page. Self-contained: no external resources.
  Only the JSON inside <script id="lesson-data"> changes between lessons
  (see schemas/lesson-data.schema.json and scripts/build_lesson.py).
  Escape "</" as "<\/" inside that JSON.
-->
<style>
:root {
  --bg: #f8f7f4; --surface: #ffffff; --surface-2: #f1f0ec; --text: #1d1d1b; --muted: #64625c;
  --rule: #e5e3dc; --rule-strong: #cfccc3; --ink: #1d1d1b; --ink-text: #ffffff; --accent: #2456a6;
  --mark: #b8f2fe; --mark-soft: #ecfbff; --mark-ring: #2fb3d6; --plot: #1786a8;
  --term-bg: #16181b; --term-text: #e6e6e3; --term-dim: #9a9a96; --term-ps1: #8be0f5;
  --ok: #1d6a39; --ok-bg: #e9f4ec; --mid: #845600; --mid-bg: #fbf2dc; --bad: #a3281e; --bad-bg: #fbecea;
  --radius: 12px;
  font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  font-size: 17px; line-height: 1.7; color: var(--text); background: var(--bg);
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
}
:root[data-theme="dark"] {
  --bg: #18181a; --surface: #202023; --surface-2: #29292c; --text: #e8e7e3; --muted: #a9a7a0;
  --rule: #323235; --rule-strong: #48484c; --ink: #e8e7e3; --ink-text: #18181a; --accent: #8fb4f2;
  --mark: rgba(120, 222, 248, .28); --mark-soft: rgba(120, 222, 248, .08); --mark-ring: #6fd3ee; --plot: #78def8; --term-bg: #0f1012;
  --ok: #8dd3a4; --ok-bg: #17301f; --mid: #efc46e; --mid-bg: #33290f; --bad: #ff9f95; --bad-bg: #3a1815;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    --bg: #18181a; --surface: #202023; --surface-2: #29292c; --text: #e8e7e3; --muted: #a9a7a0;
    --rule: #323235; --rule-strong: #48484c; --ink: #e8e7e3; --ink-text: #18181a; --accent: #8fb4f2;
    --mark: rgba(120, 222, 248, .28); --mark-soft: rgba(120, 222, 248, .08); --mark-ring: #6fd3ee; --plot: #78def8; --term-bg: #0f1012;
    --ok: #8dd3a4; --ok-bg: #17301f; --mid: #efc46e; --mid-bg: #33290f; --bad: #ff9f95; --bad-bg: #3a1815;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); }
.wrap { max-width: 680px; margin: 0 auto; padding: 48px 20px 72px; }

/* header */
header.top h1 { font-size: 1.65rem; font-weight: 650; line-height: 1.3; letter-spacing: -.01em; margin: 0 0 6px; }
#intro { margin: 0; color: var(--muted); font-size: .94rem; }
#intro:empty { display: none; }
.progress { display: flex; align-items: center; gap: 12px; margin: 20px 0 0; }
.bar { flex: 1; height: 4px; background: var(--rule); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--ink); width: 0; transition: width .3s ease-out; }
#progress p { margin: 0; font-size: .82rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .bar > span { transition: none; } }

/* tabs */
[role="tablist"] { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--rule); margin: 24px 0 32px; }
[role="tablist"]::-webkit-scrollbar { display: none; }
[role="tab"] { appearance: none; flex: none; background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 10px 12px; font: inherit; font-size: .92rem; color: var(--muted); cursor: pointer; white-space: nowrap; }
[role="tab"][aria-selected="true"] { color: var(--text); border-bottom-color: var(--ink); font-weight: 600; }

/* knowledge-point stepper: one numbered dot per point */
.stepper { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 24px; padding: 0; list-style: none; }
.stepper button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--rule-strong); background: transparent; color: var(--muted); font: inherit; font-size: .85rem; font-variant-numeric: tabular-nums; cursor: pointer; transition: background-color .12s ease, border-color .12s ease; }
.stepper button[data-status="inprog"] { border-style: dashed; border-color: var(--text); color: var(--text); }
.stepper button[data-status="done"] { background: var(--ink); border-color: var(--ink); color: var(--ink-text); }
.stepper button[data-status="mixed"] { background: var(--mid-bg); border-color: var(--mid); color: var(--mid); }
.stepper button[aria-current="step"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--mark-ring); color: var(--text); border-color: var(--text); }
.stepper button[aria-current="step"][data-status="done"] { color: var(--ink-text); }

/* typography */
h2 { font-size: 1.3rem; font-weight: 650; line-height: 1.4; margin: 0 0 8px; }
h3 { font-size: 1rem; font-weight: 600; margin: 0 0 6px; }
p { margin: 8px 0; }
.muted { color: var(--muted); }
.small { font-size: .9rem; }
strong { font-weight: 600; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88em; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
pre { background: var(--surface-2); padding: 12px 14px; border-radius: 10px; overflow-x: auto; margin: 12px 0; line-height: 1.55; }
pre code { background: none; padding: 0; }

/* the point heading sits on the page, not in a box */
.card.kp-head { background: none; border: 0; padding: 0; margin: 0 0 20px; }
.kp-meta { margin: 0 0 4px; font-size: .82rem; color: var(--muted); letter-spacing: .02em; }
details.why { margin: 4px 0 0; font-size: .88rem; color: var(--muted); }
details.why summary { cursor: pointer; width: fit-content; }
details.why p { margin: 4px 0 0; }

/* question cards */
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 24px; margin: 0 0 16px; }
.card:not(.open):not(.kp-head):not(.group) { background: transparent; }
.card.open { border-color: var(--rule-strong); }
.card.read { background: none; border: 0; border-top: 1px solid var(--rule); border-radius: 0; padding: 24px 0 8px; margin: 0; }
.card.read:last-of-type { margin-bottom: 24px; }
.card.read h2 { font-size: 1.15rem; }
.card legend, .card > p:first-child > strong, .card > h2 { font-size: 1.1rem; font-weight: 600; line-height: 1.6; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { padding: 0; margin-bottom: 12px; }
fieldset.conf { margin-top: 20px; }
fieldset.conf legend { font-size: .9rem; font-weight: 500; color: var(--muted); margin-bottom: 8px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 20px; }

/* buttons */
button.btn, a.btn, label.btn { font: inherit; font-size: .95rem; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 20px; border-radius: 10px; border: 1px solid var(--ink); background: var(--ink); color: var(--ink-text); cursor: pointer; text-decoration: none; transition: transform .12s ease-out, opacity .12s ease; }
button.btn:active:not(:disabled), label.btn:active { transform: scale(.98); }
button.btn.secondary, label.btn.secondary { background: transparent; color: var(--text); border-color: var(--rule-strong); }
button.btn.quiet { background: none; border-color: transparent; color: var(--muted); font-weight: 500; padding-left: 8px; padding-right: 8px; }
button.btn:disabled { background: var(--rule); border-color: var(--rule); color: var(--muted); cursor: not-allowed; }
@media (hover: hover) and (pointer: fine) {
  button.btn:hover:not(:disabled), label.btn:hover { opacity: .88; }
  button.btn.secondary:hover, label.btn.secondary:hover, button.btn.quiet:hover { opacity: 1; background: var(--surface-2); }
}

/* answer options */
.option { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; margin: 8px 0; cursor: pointer; background: var(--surface); transition: border-color .12s ease, background-color .12s ease; }
.option input { margin: 5px 0 0; accent-color: var(--ink); flex: none; }
.option:has(input:checked) { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.option.right, .option.right:has(input:checked) { border-color: var(--ok); background: var(--ok-bg); box-shadow: none; }
.option.wrong, .option.wrong:has(input:checked) { border-color: var(--bad); background: var(--bad-bg); box-shadow: none; }
.option .why { display: block; font-size: .9rem; color: var(--muted); margin-top: 4px; }
.option.right .why, .option.wrong .why { color: var(--text); }
@media (hover: hover) and (pointer: fine) { .option:not(.right):not(.wrong):hover { border-color: var(--rule-strong); background: var(--surface-2); } }

/* chips: confidence, mistake causes */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { position: relative; display: inline-flex; align-items: center; min-height: 38px; padding: 6px 14px; border: 1px solid var(--rule-strong); border-radius: 99px; background: transparent; color: var(--text); font: inherit; font-size: .9rem; cursor: pointer; transition: background-color .12s ease, border-color .12s ease; }
.chip input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.chip[aria-pressed="true"], .chip:has(input:checked) { background: var(--ink); border-color: var(--ink); color: var(--ink-text); }
.chip:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (hover: hover) and (pointer: fine) { .chip:not([aria-pressed="true"]):not(:has(input:checked)):hover { background: var(--surface-2); } }

/* text entry; blanks get the logo blue */
textarea, input[type="text"] { font: inherit; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--rule-strong); background: var(--surface); color: var(--text); transition: border-color .12s ease, box-shadow .12s ease; }
textarea { min-height: 104px; resize: vertical; line-height: 1.6; }
textarea:focus, input[type="text"]:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px var(--mark); }
.flow input[type="text"], table.fill input[type="text"] { background: var(--mark-soft); border-style: dashed; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
textarea:focus-visible, input[type="text"]:focus-visible { outline: none; }

/* feedback */
.result { border-radius: 10px; padding: 12px 16px; margin: 20px 0 8px; }
.result:focus { outline: none; }
.result.correct, .result.coherent { background: var(--ok-bg); color: var(--ok); }
.result.partial, .result.partly_coherent { background: var(--mid-bg); color: var(--mid); }
.result.incorrect, .result.dont_know, .result.incoherent { background: var(--bad-bg); color: var(--bad); }
.result strong { display: block; }
.result p { color: var(--text); margin: 6px 0 0; }
.coach { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--rule-strong); color: var(--text); }
.coach .coach-label { font-size: .8rem; font-weight: 600; color: var(--muted); margin: 0; }
.notice { background: var(--surface-2); padding: 10px 14px; border-radius: 10px; margin: 12px 0; font-size: .92rem; }
.teach { background: var(--surface-2); border-radius: var(--radius); padding: 18px 20px; margin: 16px 0 0; }
.teach h3 { font-size: .85rem; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.teach ol { padding-left: 1.3em; margin: 8px 0; }
.checklist label { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
.checklist input { margin-top: 6px; accent-color: var(--ink); }

/* fill-in tables */
table.fill { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: .94rem; }
table.fill th, table.fill td { border-bottom: 1px solid var(--rule); padding: 10px 8px; text-align: left; vertical-align: top; }
table.fill th { font-size: .82rem; font-weight: 600; color: var(--muted); }
table.fill input[type="text"] { padding: 6px 8px; }
.cell-ok { background: var(--ok-bg); }
.cell-bad { background: var(--bad-bg); }
.expected { display: block; font-size: .85rem; color: var(--muted); }

/* flow diagrams: numbered steps on one line */
.flow { position: relative; margin: 16px 0; }
.flow::before { content: ""; position: absolute; left: 14px; top: 16px; bottom: 16px; width: 2px; background: var(--rule); }
.node { position: relative; padding: 4px 0 4px 44px; min-height: 36px; }
.node .num { position: absolute; left: 0; top: 4px; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--surface); border: 1px solid var(--rule-strong); font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.node.blank .num { background: var(--mark); border: 1px dashed var(--text); color: var(--text); }
.node.cell-ok, .node.cell-bad { background: none; }
.node.cell-ok .num { background: var(--ok-bg); border: 1px solid var(--ok); color: var(--ok); }
.node.cell-bad .num { background: var(--bad-bg); border: 1px solid var(--bad); color: var(--bad); }
.arrow { padding: 0 0 0 44px; min-height: 12px; font-size: .8rem; color: var(--muted); }

/* flashcards */
.flashcard { display: flex; align-items: center; justify-content: center; min-height: 132px; padding: 28px 24px; border: 1px solid var(--rule-strong); border-radius: var(--radius); background: var(--surface-2); text-align: center; font-size: 1.25rem; font-weight: 600; line-height: 1.5; }
.flashcard.back { background: var(--mark-soft); border-color: var(--ink); margin-top: 12px; }

/* numeric answers */
.num-row { display: flex; gap: 10px; align-items: center; }
.num-row .unit { color: var(--muted); white-space: nowrap; }
.reads { min-height: 1.5em; margin: 6px 0 0; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* putting things in order */
.order-list { list-style: none; padding: 0; margin: 12px 0; }
.order-list li { display: flex; align-items: center; gap: 10px; border: 1px solid var(--rule-strong); border-radius: 10px; padding: 4px 6px 4px 12px; margin: 6px 0; background: var(--surface); min-height: 46px; }
.order-list .n { flex: none; width: 1.4em; color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
.order-list .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.order-list li.ok { border-color: var(--ok); background: var(--ok-bg); }
.order-list li.bad { border-color: var(--bad); background: var(--bad-bg); }
.order-list .mark { flex: none; padding-right: 8px; font-weight: 600; }
.order-list li.ok .mark { color: var(--ok); }
.order-list li.bad .mark { color: var(--bad); }
.order-list.tiles { display: flex; flex-wrap: wrap; gap: 8px; }
.order-list.tiles li { margin: 0; padding: 2px 4px 2px 10px; }
.order-list.tiles .n { display: none; }
.tools { flex: none; display: flex; }
.icon-btn { width: 40px; height: 40px; border: 0; border-radius: 8px; background: none; color: var(--muted); font: inherit; font-size: 1.05rem; cursor: pointer; }
.icon-btn:disabled { opacity: .3; cursor: default; }
@media (hover: hover) and (pointer: fine) { .icon-btn:not(:disabled):hover { background: var(--surface-2); color: var(--text); } }
.pool { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }
.pool > p { flex-basis: 100%; margin: 0; }
.pool-item { font: inherit; text-align: left; min-height: 44px; padding: 8px 14px; border: 1px dashed var(--mark-ring); border-radius: 10px; background: var(--mark-soft); color: var(--text); cursor: pointer; overflow-wrap: anywhere; }
.pool-item:disabled { opacity: .45; cursor: default; }
.pool:not(.tiles) .pool-item { flex-basis: 100%; }
@media (hover: hover) and (pointer: fine) { .pool-item:not(:disabled):hover { background: var(--mark); } }
.mono, .mono .txt, .mono .pool-item { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88rem; white-space: pre-wrap; }

/* cloze passages */
.cloze { line-height: 2.3; }
.cloze input[type="text"] { width: auto; max-width: 100%; display: inline-block; padding: 1px 8px; margin: 0 2px; background: var(--mark-soft); border-style: dashed; line-height: 1.6; }
.cloze .blank-done { border-radius: 6px; padding: 2px 6px; }
.cloze .expected { display: inline; margin-left: 6px; }
.cloze .blank-done label { margin-left: 6px; white-space: nowrap; }
code.keep-space { white-space: pre; }
.bank { margin: 8px 0 4px; }
.bank > p { margin: 0 0 6px; }

/* code tracing */
.code-wrap { position: relative; }
.code-wrap .lang { position: absolute; right: 10px; top: 6px; font-size: .72rem; color: var(--muted); letter-spacing: .03em; }
pre.code-lines { padding: 12px 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .86rem; }
.code-lines .ln { display: block; position: relative; padding: 0 14px 0 3.2em; white-space: pre; }
.code-lines .ln::before { content: attr(data-n); position: absolute; left: 0; width: 2.3em; text-align: right; color: var(--muted); user-select: none; }
.code-lines .ln.cur { background: var(--mark); box-shadow: inset 3px 0 0 var(--mark-ring); }
.trace { border: 1px solid var(--rule-strong); border-radius: 10px; padding: 14px 16px; margin: 12px 0; }
.trace-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.trace-head h3 { margin: 0; }
.trace-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.trace-label { margin: 8px 0 4px; font-size: .8rem; font-weight: 600; color: var(--muted); }
.trace table.vars { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .85rem; }
.trace table.vars th { color: var(--text); font-size: .85rem; width: 40%; }
.trace table.vars tr.changed td, .trace table.vars tr.changed th { background: var(--mark-soft); font-weight: 600; }
.trace pre.out { margin: 0; min-height: 2.4em; font-size: .85rem; }
.trace .row { margin-top: 12px; }
.trace-qs { padding-left: 1.3em; }
.trace-qs li { padding: 6px 8px; border-radius: 8px; margin: 4px 0; }
.trace-qs .q { display: block; margin-bottom: 6px; }

/* simulated terminal */
.term { background: var(--term-bg); color: var(--term-text); border-radius: 10px; padding: 12px 14px; margin: 12px 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .86rem; line-height: 1.55; }
.term:focus-within { box-shadow: 0 0 0 3px var(--mark-ring); }
.term pre { background: none; padding: 0; margin: 0; border-radius: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: inherit; }
.term .ps1 { color: var(--term-ps1); }
.term .note { color: var(--term-dim); }
.term .err { color: #ff9f95; }
.term-line label { display: flex; gap: 8px; align-items: center; }
.term input.term-in { flex: 1; min-width: 0; padding: 2px 0; border: 0; border-radius: 0; background: transparent; color: var(--term-text); font: inherit; caret-color: var(--term-ps1); }
.term input.term-in:focus { box-shadow: none; }
.term-task { margin: 12px 0 0; }

/* graphs and parameter labs */
svg.plot { display: block; width: 100%; height: auto; margin: 12px 0 4px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
.plot .grid line { stroke: var(--rule); stroke-width: 1; }
.plot .axis { stroke: var(--muted); stroke-width: 1.2; }
.plot text { fill: var(--muted); font-size: 12px; font-family: inherit; font-variant-numeric: tabular-nums; }
.plot .axis-label { fill: var(--text); font-weight: 600; }
.plot path { fill: none; stroke-linejoin: round; stroke-linecap: round; }
.plot .curve { stroke: var(--plot); stroke-width: 3; }
.plot .target { stroke: var(--text); stroke-width: 2; stroke-dasharray: 7 6; opacity: .5; }
.plot .pt { fill: var(--text); }
.plot .pt-label { fill: var(--text); }
.legend { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 0; }
.legend .key { display: inline-block; width: 22px; height: 0; border-top: 3px solid var(--plot); margin-left: 8px; }
.legend .key:first-child { margin-left: 0; }
.legend .key.target { border-top: 2px dashed var(--muted); }
.sliders { margin: 12px 0; }
.slider { display: grid; grid-template-columns: minmax(72px, auto) 1fr minmax(64px, auto); gap: 12px; align-items: center; min-height: 44px; }
.slider .name { font-size: .92rem; }
.slider input[type="range"] { width: 100%; accent-color: var(--plot); }
.slider .val { font-variant-numeric: tabular-nums; text-align: right; font-size: .92rem; }
.readouts { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 8px 0 12px; }
.readout { display: flex; flex-direction: column; }
.readout b { font-size: 1.2rem; font-weight: 650; font-variant-numeric: tabular-nums; }

/* lists of past answers */
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 8px; }
.badge { font-size: .78rem; border: 1px solid var(--rule-strong); border-radius: 99px; padding: 1px 9px; color: var(--muted); }
.badge.hot { border-color: var(--bad); color: var(--bad); }
.group h3 { margin-top: 16px; }
.mistake { border-top: 1px solid var(--rule); padding: 12px 0; }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
select { font: inherit; font-size: .85rem; padding: 3px 8px; border-radius: 8px; border: 1px solid var(--rule-strong); background: var(--surface); color: var(--text); }
footer { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--rule); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; font-size: .82rem; color: var(--muted); }
@media (max-width: 520px) {
  :root { font-size: 16px; }
  .wrap { padding: 28px 16px 48px; }
  header.top h1 { font-size: 1.4rem; }
  .card { padding: 18px 16px; }
  [role="tab"] { padding: 10px 9px; }
  .trace-grid { grid-template-columns: 1fr; gap: 4px; }

                "三次"

          "trace": [
            {
              "line": 1,
              "vars": {
                "total": 0
              }
            },
            {
              "line": 2,
              "vars": {
                "i": 1
              },
              "note": "range(1, 4) 依次给出 1、2、3，不含 4。"

            {
              "line": 3,
              "vars": {
                "total": 1
              }
            },
            {
              "line": 2,
              "vars": {
                "i": 2
              }
            },
            {
              "line": 3,
              "vars": {
                "total": 5
              }
            },
            {
              "line": 2,
              "vars": {
                "i": 3
              }
            },
            {
              "line": 3,
              "vars": {
                "total": 14
              }
            },
            {
              "line": 4,
              "out": "14"
            }
          ],
          "explanation": "1² + 2² + 3² = 14。range 的右端不包含在内，是最常见的错。"
        }
      ]
    },
    {
      "id": "kp-git",
      "title": "第一次提交：init、add、commit",
      "importance": "core",
      "knowledge_type": "procedural",
      "interaction_type": "terminal",

          "commands": [
            {

              "accept": [

              ],
              "output": "Initialized empty Git repository in /home/you/demo/.git/"

              "step": 0.5,

                "text": "波峰变成原来的 2 倍高",

                "explanation": "那是 A 的作用：A 控制振幅。"

              }
            ]
          }
        }
      ]
    },
    {
      "id": "kp-pendulum",
      "title": "单摆周期和摆长的关系",
      "importance": "important",
      "knowledge_type": "conceptual",
      "method": "predict_verify",
      "interaction_type": "simulation",

          "id": "length",

              "min": 0.1,
              "max": 4,
              "step": 0.1,
              "value": 1,
              "unit": "m"

              "name": "g",
              "label": "重力加速度 g",

              "max": 25,
              "step": 0.1,
              "value": 9.8,
              "unit": "m/s²"

              "label": "周期 T",
              "expr": "2*pi*sqrt(L/g)",
              "unit": "s",
              "digits": 2
            },
            {
              "label": "频率 f",
              "expr": "1/(2*pi*sqrt(L/g))",
              "unit": "Hz",
              "digits": 2
            }
          ],
          "plot": {
            "expr": "2*pi*sqrt(x/g)",
            "x_range": [
              0,
              4
            ],
            "y_range": [
              0,
              5
            ],
            "x_label": "L (m)",
            "y_label": "T (s)"
          },
          "predict": {
            "question": "摆长变成原来的 4 倍，周期会变成原来的几倍？",
            "options": [
              {
                "text": "2 倍",
                "correct": true,
                "explanation": "T 和 √L 成正比，√4 = 2。"
              },
              {
                "text": "4 倍",
                "correct": false,
                "explanation": "这是把 T 当成和 L 成正比了。"
              },
              {
                "text": "不变",
                "correct": false,
                "explanation": "小角度下周期和振幅、摆球质量无关，但和摆长有关。"
              },
              {
                "text": "16 倍",
                "correct": false,
                "explanation": "这是把关系当成平方了，方向反了。"
              }
            ]
          },
          "fallback": {
            "question": "摆长变成原来的 4 倍，单摆周期变成几倍？为什么？",
            "answer": "2 倍，因为 T = 2π√(L/g)，T 和 √L 成正比。"
          }
        }
      ]
    }
  ]
}

      card.appendChild(h('div', { class: 'row' }, btn = h('button', { type: 'button', class: 'btn', disabled: !norm(s.draft), onclick: function () {
        s.submitted = true; s.text = s.draft; save(); render(true);
      } }, T.ptCompare)));
      return;
    }
    card.appendChild(h('p', null, h('strong', null, T.yourAnswer + T.colon), s.text));
    var ref = pt.points.filter(function (p) { return p.kp_id === pt.recall.kp_id; })[0];
    if (ref) card.appendChild(h('div', { class: 'teach', tabindex: '-1', 'data-focus': s.done ? null : '1' },
      h('p', null, h('strong', null, T.ptConclusion + T.colon), rich(ref.conclusion)), h('p', null, h('strong', null, T.ptExample + T.colon), rich(ref.example))));
    if (!s.done && recallKp) {
      card.appendChild(selfGrade([['correct', T.gotIt], ['partial', T.partly], ['incorrect', T.missed]], function (result) {
        addAttempt(recallKp, 'plain-talk', { phase: 'plain_talk_recall', result: result, question: pt.recall.prompt,
          question_format: 'free_recall', interaction: 'free_text', self_assessed: true });
        s.done = true; s.result = result; save(); render(true);
      }));
      card.appendChild(h('p', { class: 'small muted' }, T.selfNote));
    } else if (s.done) {
      var ptAttempt = state.attempts.filter(function (a) { return String(a.id).split('~')[2] === 'plain-talk'; }).pop();
      card.appendChild(resultBanner(s.result, null, ptAttempt && ptAttempt.coach_graded ? coachNote(ptAttempt) : h('p', { class: 'small' }, T.selfAssessed)));
    }
  }

  function renderMistakes(panel) {
    var bad = state.attempts.filter(function (a) { return BAD.indexOf(a.result) >= 0; });
    if (!bad.length) { panel.appendChild(h('p', { class: 'card' }, T.mistakesEmpty)); return; }
    panel.appendChild(h('p', { class: 'muted' }, fmt(T.mistakesSummary, { n: bad.length })));
    var groups = {};
    bad.forEach(function (a) { (groups[a.error_type || 'none'] = groups[a.error_type || 'none'] || []).push(a); });
    var order = Object.keys(T.errorTypes).concat(['none']);
    order.forEach(function (type) {
      var list = groups[type];
      if (!list) return;
      list.sort(function (a, b) { return (b.confidence === 3 && b.result === 'incorrect') - (a.confidence === 3 && a.result === 'incorrect'); });
      var section = h('section', { class: 'card group' }, h('h3', null, type === 'none' ? T.unclassified : T.errorTypes[type][0] + ' · ' + T.errorTypes[type][1]));
      list.forEach(function (a) {
        var kp = kpById(a.kp_id);
        var hot = a.result === 'incorrect' && a.confidence === 3;
        var select = h('select', { 'aria-label': T.whyWrong, onchange: function () {
          if (this.value) a.error_type = this.value; else delete a.error_type;
          save(); render();
        } }, h('option', { value: '' }, T.unclassified), Object.keys(T.errorTypes).map(function (t) {
          var o = h('option', { value: t }, T.errorTypes[t][0]);
          if (a.error_type === t) o.selected = true;
          return o;
        }));
        section.appendChild(h('div', { class: 'mistake' },
          h('div', { class: 'badges' }, h('span', { class: 'badge' }, kp ? kp.title : a.kp_id), h('span', { class: 'badge' }, T[a.result] || a.result),
            a.confidence ? h('span', { class: 'badge' }, fmt(T.confShort, { c: a.confidence })) : null,
            hot ? h('span', { class: 'badge hot' }, T.hotBadge) : null,
            a.coach_graded ? h('span', { class: 'badge' }, T.coachGraded) : null),
          h('p', null, rich(a.question || '')), a.coach_graded && a.note ? h('p', { class: 'small' }, rich(a.note)) : null, select));
      });
      panel.appendChild(section);
    });
  }

  function buildExport() {
    var viewed = Object.keys(state.ptViewed).filter(function (k) { return state.ptViewed[k] && kpById(k); });
    var out = {
      format: EXPORT_FORMAT, schema_version: '1.0', source: 'html', lesson_id: data.lesson_id, topic: data.topic,
      exported_at: isoNow(),
      knowledge_points: data.knowledge_points.map(function (k) {
        var d = { id: k.id, title: k.title, importance: k.importance, knowledge_type: k.knowledge_type };
        if (k.secondary_types && k.secondary_types.length) d.secondary_types = k.secondary_types;
        return d;
      }),
      attempts: state.attempts.map(function (a) { return JSON.parse(JSON.stringify(a)); })
    };
    if (data.language) out.language = data.language;
    if (viewed.length) out.plain_talk_viewed_kp_ids = viewed;
    return JSON.stringify(out, null, 2);
  }

  function buildAnswers() {
    var lines = ['# closebook · ' + T.myAnswers, '', data.topic + ' (' + data.lesson_id + ') · ' + isoNow(), '', '> ' + T.coachAsk, ''];
    var idLine = function (id) { return '**ID:** `' + id + '`'; };
    data.knowledge_points.forEach(function (kp) {
      var rows = [];
      kp.items.forEach(function (it) {
        var u = state.ui[keyOf(kp, it)];
        if (!u || !u.done) return;
        var q = it.question || it.prompt || it.front || (it.fallback && it.fallback.question) || it.id;
        var row = ['**Q:** ' + q, '**' + T.yourAnswer + ':** ' + (u.answerText || (u.choice !== undefined && it.options ? String.fromCharCode(65 + u.choice) + '. ' + it.options[u.choice].text
            : (u.vals && u.vals.length ? u.vals.map(function (v) { return v || '—'; }).join(' / ') : T.noText))),
          '**' + T.gradeSelf + '** ' + (T[u.result] || u.result) + (u.conf ? ' · ' + fmt(T.confShort, { c: u.conf }) : '')];
        if (u.attemptId) row.unshift(idLine(u.attemptId));
        if (u.ticks && it.reference_points) {
          row.push(it.reference_points.map(function (p, i) { return (u.ticks[i] ? '- [x] ' : '- [ ] ') + p.text; }).join('\n'));
        }
        rows.push(row.join('\n'));
      });
      if (rows.length) { lines.push('## ' + kp.title, ''); lines.push(rows.join('\n\n'), ''); }
    });
    if (state.recall.text) {
      lines.push('## ' + T.tabRecall, '', '**Q:** ' + data.free_recall.prompt, '**' + T.yourAnswer + ':** ' + state.recall.text, '');
      recallAttempts().forEach(function (a) { var kp = kpById(a.kp_id); lines.push('- ' + (kp ? kp.title : a.kp_id) + ' · ' + (T[a.result] || a.result) + ' · ' + idLine(a.id)); });
      lines.push('');
    }
    if (state.pt.text) {
      var pt = state.attempts.filter(function (a) { return String(a.id).split('~')[2] === 'plain-talk'; }).pop();
      lines.push('## ' + T.tabPlain, '');
      if (pt) lines.push(idLine(pt.id));
      lines.push('**Q:** ' + data.plain_talk.recall.prompt, '**' + T.yourAnswer + ':** ' + state.pt.text, '');
    }
    return lines.join('\n');
  }

  function copyText(area, status) {
    function fallback() {
      try { area.focus(); area.select(); var ok = document.execCommand('copy'); status.textContent = ok ? T.copied : T.copyFailed; }
      catch (e) { status.textContent = T.copyFailed; }
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(area.value).then(function () { status.textContent = T.copied; }, fallback);
      } else fallback();
    } catch (e) { fallback(); }
  }
  function downloadText(text, name, type, status) {
    try {
      var url = URL.createObjectURL(new Blob([text], { type: type }));
      var a = h('a', { href: url, download: name });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    } catch (e) { status.textContent = T.downloadFailed; }
  }
  function exportBox(title, help, builder, filename, type) {
    var area = h('textarea', { rows: 8, readonly: true, 'aria-label': title, class: 'export-area' });
    var status = h('p', { class: 'small', 'aria-live': 'polite' });
    return h('section', { class: 'card' }, h('h2', null, title), h('p', { class: 'small muted' }, help),
      h('div', { class: 'row' },
        h('button', { type: 'button', class: 'btn', onclick: function () { area.value = builder(); status.textContent = ''; } }, T.generate),
        h('button', { type: 'button', class: 'btn secondary', onclick: function () { if (!area.value) area.value = builder(); copyText(area, status); } }, T.copy),
        h('button', { type: 'button', class: 'btn secondary', onclick: function () { if (!area.value) area.value = builder(); downloadText(area.value, filename, type, status); } }, T.download)),
      h('label', null, h('span', { class: 'sr-only' }, title), area), status);
  }

  function importJson(text) {
    var obj, raw = String(text || ''), start = raw.indexOf('{'), end = raw.lastIndexOf('}');
    try { obj = JSON.parse(start >= 0 && end > start ? raw.slice(start, end + 1) : raw); } catch (e) { return T.importBad; }
    if (obj && obj.format === GRADING_FORMAT && Array.isArray(obj.grades)) return applyGrading(obj);
    if (!obj || obj.format !== EXPORT_FORMAT || !Array.isArray(obj.attempts)) return T.importBad;
    if (obj.lesson_id && obj.lesson_id !== data.lesson_id) return fmt(T.importOther, { id: obj.lesson_id });
    var n = 0;
    obj.attempts.forEach(function (a) {
      if (!a || typeof a !== 'object' || !a.id || !a.kp_id || !a.result || !kpById(a.kp_id)) return;
      if (findAttempt(a.id)) return;
      state.attempts.push(a); n += 1;
    });
    state.attempts.sort(function (a, b) { return String(a.at) < String(b.at) ? -1 : (String(a.at) > String(b.at) ? 1 : 0); });
    (obj.plain_talk_viewed_kp_ids || []).forEach(function (k) { state.ptViewed[k] = true; });
    rebuildFromAttempts();
    save();
    return n ? fmt(T.importOk, { n: n }) : T.importNone;
  }

  function applyGrading(obj) {
    if (obj.lesson_id && obj.lesson_id !== data.lesson_id) return fmt(T.importOther, { id: obj.lesson_id });
    var applied = 0, missing = 0;
    obj.grades.forEach(function (g) {
      var a = g && findAttempt(g.attempt_id);
      if (!a || RESULTS.indexOf(g.result) < 0) { missing += 1; return; }
      var note = typeof g.feedback === 'string' ? g.feedback : '';
      var errorType = BAD.indexOf(g.result) >= 0 && T.errorTypes[g.error_type] ? g.error_type : (BAD.indexOf(g.result) >= 0 ? a.error_type : undefined);
      if (a.coach_graded && a.result === g.result && (a.note || '') === note && a.error_type === errorType) return;
      a.result = g.result; a.coach_graded = true;
      delete a.self_assessed;
      if (note) a.note = note; else delete a.note;
      if (errorType) a.error_type = errorType; else delete a.error_type;
      Object.keys(state.ui).forEach(function (k) { if (state.ui[k].attemptId === a.id) state.ui[k].result = a.result; });
      if (String(a.id).split('~')[2] === 'plain-talk') state.pt.result = a.result;
      applied += 1;
    });
    save();
    var msg = applied ? fmt(T.gradingOk, { n: applied }) : (missing ? '' : T.gradingNone);
    if (missing) msg += (msg ? ' ' : '') + fmt(T.gradingMissing, { n: missing });
    return msg;
  }

  function renderData(panel) {
    panel.appendChild(exportBox(T.exportTitle, T.exportHelp, buildExport, data.lesson_id + '.closebook.json', 'application/json'));
    panel.appendChild(exportBox(T.exportAnswers, T.exportAnswersHelp, buildAnswers, data.lesson_id + '.answers.md', 'text/markdown'));
    var area = h('textarea', { rows: 6, 'aria-label': T.importTitle, class: 'import-area' });
    var status = h('p', { class: 'small', 'aria-live': 'polite' });
    var file = h('input', { type: 'file', accept: '.json,application/json', class: 'sr-only', id: 'import-file', onchange: function () {
      var f = this.files && this.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () { area.value = String(reader.result || ''); };
      reader.readAsText(f);
    } });
    panel.appendChild(h('section', { class: 'card' }, h('h2', null, T.importTitle), h('p', { class: 'small muted' }, T.importHelp),
      h('label', null, h('span', { class: 'sr-only' }, T.importTitle), area),
      h('div', { class: 'row' },
        h('button', { type: 'button', class: 'btn', onclick: function () { var msg = importJson(area.value); status.textContent = msg; announce(msg); renderProgress(); } }, T.importBtn),
        file, h('label', { for: 'import-file', class: 'btn secondary', role: 'button', tabindex: '0',
          onkeydown: function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); } } }, T.importFile)),
      status));
    panel.appendChild(h('section', { class: 'card' }, h('p', { class: 'small muted' }, state.storage ? T.storageOn : T.storageOff),
      h('button', { type: 'button', class: 'btn quiet', onclick: function () {
        if (!window.confirm(T.resetConfirm)) return;
        state.attempts = []; state.seq = 0; state.ui = {}; state.teach = {}; state.recall = {}; state.pt = {}; state.ptViewed = {};
        save(); render();
      } }, T.reset)));
  }

  // ---------- frame ----------
  function tabs() {
    var list = [['learn', T.tabLearn]];
    if (data.free_recall) list.push(['recall', T.tabRecall]);
    if (data.plain_talk) list.push(['plain', T.tabPlain]);
    list.push(['mistakes', T.tabMistakes], ['data', T.tabData]);
    return list;
  }
  function renderTabs() {
    var nav = document.getElementById('tabs');
    nav.textContent = '';
    nav.setAttribute('aria-label', 'closebook');
    var list = tabs();
    list.forEach(function (t, i) {
      nav.appendChild(h('button', { type: 'button', role: 'tab', id: 'tab-' + t[0], 'aria-selected': state.tab === t[0] ? 'true' : 'false',
        'aria-controls': 'panel', tabindex: state.tab === t[0] ? '0' : '-1',
        onclick: function () { state.tab = t[0]; render(); },
        onkeydown: function (e) {
          var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
          if (!d) return;
          e.preventDefault();
          var nt = list[(i + d + list.length) % list.length][0];
          state.tab = nt; render(); document.getElementById('tab-' + nt).focus();
        } }, t[1]));
    });
  }
  function renderProgress() {
    var total = 0, done = 0;
    data.knowledge_points.forEach(function (kp) { kp.items.forEach(function (it) { total++; var u = state.ui[keyOf(kp, it)]; if (u && u.done) done++; }); });
    var pct = total ? Math.round(done * 100 / total) : 0;
    var el = document.getElementById('progress');
    el.textContent = '';
    el.appendChild(h('div', { class: 'bar', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(total), 'aria-valuenow': String(done),
      'aria-label': fmt(T.progress, { done: done, total: total }) }, h('span', { style: 'width:' + pct + '%' })));
    el.appendChild(h('p', { class: 'small muted' }, fmt(T.progress, { done: done, total: total })));
  }
  function render(moveFocus) {
    renderTabs();
    renderProgress();
    var panel = document.getElementById('panel');
    panel.textContent = '';
    panel.setAttribute('aria-labelledby', 'tab-' + state.tab);
    if (state.tab === 'learn') renderLearn(panel);
    else if (state.tab === 'recall') renderRecall(panel);
    else if (state.tab === 'plain') renderPlain(panel);
    else if (state.tab === 'mistakes') renderMistakes(panel);
    else renderData(panel);
    save();
    var scope = state.focusKey ? Array.prototype.filter.call(panel.querySelectorAll('[data-key]'), function (el) { return el.getAttribute('data-key') === state.focusKey; })[0] : null;
    state.focusKey = null;
    if (moveFocus !== false) {
      var target = (scope && (scope.querySelector('[data-focus="1"]') || scope.querySelector('input:not([disabled]), textarea, button:not([disabled])'))) ||
        panel.querySelector('[data-focus="1"]') ||
        panel.querySelector('.card.open textarea, .card.open input, .card.open button');
      if (target && moveFocus) target.focus({ preventScroll: false });
      else if (target && document.activeElement === document.body) target.focus({ preventScroll: true });
    }
  }

  function fail(message) {
    document.getElementById('panel').appendChild(h('p', { class: 'notice' }, message));
  }

  function init() {
    T = STRINGS.en;
    try {
      data = JSON.parse(document.getElementById('lesson-data').textContent);
      if (!data || !Array.isArray(data.knowledge_points) || !data.knowledge_points.length || !data.lesson_id) throw new Error('missing lesson_id or knowledge_points');
      data.knowledge_points.forEach(function (kp) { if (!Array.isArray(kp.items) || !kp.items.length) throw new Error('point ' + kp.id + ' has no items'); });
    } catch (e) {
      fail(T.dataError + e.message);
      return;
    }
    if (/^zh/i.test(data.language || '')) { T = STRINGS.zh; }
    document.documentElement.lang = data.language || 'en';
    document.title = data.topic + ' · closebook';
    document.getElementById('title').textContent = data.topic;
    document.getElementById('intro').textContent = data.intro || '';
    document.getElementById('footer').textContent = T.footer;
    storeKey = 'closebook:' + data.lesson_id;
    restore();
    rebuildFromAttempts();

    var theme = document.getElementById('theme');
    document.getElementById('theme-label').textContent = T.theme + ' ';
    [['auto', T.themeAuto], ['light', T.themeLight], ['dark', T.themeDark]].forEach(function (o) {
      var opt = h('option', { value: o[0] }, o[1]);
      theme.appendChild(opt);
    });
    theme.value = themePref();
    applyTheme(theme.value);
    theme.addEventListener('change', function () { applyTheme(themePref(theme.value)); });
    render(false);
  }

  init();
})();
</script>
